<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de commande</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <header>
            <h2>Commandes</h2>
            <button title="Montrer statistiques" id="statistiques">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M16.19 2H7.81C4.17 2 2 4.17 2 7.81V16.18C2 19.83 4.17 22 7.81 22H16.18C19.82 22 21.99 19.83 21.99 16.19V7.81C22 4.17 19.83 2 16.19 2ZM7.63 18.15C7.63 18.56 7.29 18.9 6.88 18.9C6.47 18.9 6.13 18.56 6.13 18.15V16.08C6.13 15.67 6.47 15.33 6.88 15.33C7.29 15.33 7.63 15.67 7.63 16.08V18.15ZM12.75 18.15C12.75 18.56 12.41 18.9 12 18.9C11.59 18.9 11.25 18.56 11.25 18.15V14C11.25 13.59 11.59 13.25 12 13.25C12.41 13.25 12.75 13.59 12.75 14V18.15ZM17.87 18.15C17.87 18.56 17.53 18.9 17.12 18.9C16.71 18.9 16.37 18.56 16.37 18.15V11.93C16.37 11.52 16.71 11.18 17.12 11.18C17.53 11.18 17.87 11.52 17.87 11.93V18.15ZM17.87 8.77C17.87 9.18 17.53 9.52 17.12 9.52C16.71 9.52 16.37 9.18 16.37 8.77V7.8C13.82 10.42 10.63 12.27 7.06 13.16C7 13.18 6.94 13.18 6.88 13.18C6.54 13.18 6.24 12.95 6.15 12.61C6.05 12.21 6.29 11.8 6.7 11.7C10.07 10.86 13.07 9.09 15.45 6.59H14.2C13.79 6.59 13.45 6.25 13.45 5.84C13.45 5.43 13.79 5.09 14.2 5.09H17.13C17.17 5.09 17.2 5.11 17.24 5.11C17.29 5.12 17.34 5.12 17.39 5.14C17.44 5.16 17.48 5.19 17.53 5.22C17.56 5.24 17.59 5.25 17.62 5.27C17.63 5.28 17.63 5.29 17.64 5.29C17.68 5.33 17.71 5.37 17.74 5.41C17.77 5.45 17.8 5.48 17.81 5.52C17.83 5.56 17.83 5.6 17.84 5.65C17.85 5.7 17.87 5.75 17.87 5.81C17.87 5.82 17.88 5.83 17.88 5.84V8.77H17.87Z" fill="#7672F1"/></svg>
            </button>
            <nav class="d-f">
                <!-- Option de filtrage des commandes -->
                <button title="Voir toutes les commandes" class="selected main_button" id="total"><span>Total </span></button>
                <button title="Voir les commadnes en en_cours" class="secondary_button" id="en_cours"><span>En cours </span></button>
                <button title="Voir les commandes servies" class="secondary_button" id="servie"><span>Servie </span></button>
                <button title="Voir les commandes déjà payées" class="secondary_button" id="payée"><span>Payée </span></button>
            </nav>
        </header>
        <section>
            <!-- Barre de recherche des commandes selon leur ID -->            
            <div id="search">
                <input title="Rechercher une commande grâce à son ID" type="number" placeholder="ID de commande" min="1">
                <button class="main_button" title="Vider la barre de recherche" disabled>Annuler</button>
            </div>
            <!-- Zone d'affichage des commandes -->
            <div id="liste">
                <!-- Message en cas d'absence de commande ou aucune correspondance lors d'un filtrage -->
                <div class="noResult d-f fd-cl ai-c">
                    <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" fill="none"><path d="M14 5H20" stroke="#7672F1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 8H17" stroke="#7672F1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 11.5C21 16.75 16.75 21 11.5 21C6.25 21 2 16.75 2 11.5C2 6.25 6.25 2 11.5 2" stroke="#7672F1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 22L20 20" stroke="#7672F1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <h3>Aucune commande trouvée</h3>
                    <button class="main_button">Créer</button>
                </div>
                <!-- Message d'erreur en cas de problème de chargement des commandes (problême de connexion au serveur ou mauvaise requête) -->
                <div class="onError d-f fd-cl ai-c">
                    <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" fill="none"><path d="M19.5099 5.85L13.5699 2.42C12.5999 1.86 11.3999 1.86 10.4199 2.42L4.48992 5.85C3.51992 6.41 2.91992 7.45 2.91992 8.58V15.42C2.91992 16.54 3.51992 17.58 4.48992 18.15L10.4299 21.58C11.3999 22.14 12.5999 22.14 13.5799 21.58L19.5199 18.15C20.4899 17.59 21.0899 16.55 21.0899 15.42V8.58C21.0799 7.45 20.4799 6.42 19.5099 5.85ZM11.2499 7.75C11.2499 7.34 11.5899 7 11.9999 7C12.4099 7 12.7499 7.34 12.7499 7.75V13C12.7499 13.41 12.4099 13.75 11.9999 13.75C11.5899 13.75 11.2499 13.41 11.2499 13V7.75ZM12.9199 16.63C12.8699 16.75 12.7999 16.86 12.7099 16.96C12.5199 17.15 12.2699 17.25 11.9999 17.25C11.8699 17.25 11.7399 17.22 11.6199 17.17C11.4899 17.12 11.3899 17.05 11.2899 16.96C11.1999 16.86 11.1299 16.75 11.0699 16.63C11.0199 16.51 10.9999 16.38 10.9999 16.25C10.9999 15.99 11.0999 15.73 11.2899 15.54C11.3899 15.45 11.4899 15.38 11.6199 15.33C11.9899 15.17 12.4299 15.26 12.7099 15.54C12.7999 15.64 12.8699 15.74 12.9199 15.87C12.9699 15.99 12.9999 16.12 12.9999 16.25C12.9999 16.38 12.9699 16.51 12.9199 16.63Z" fill="#7672F1"/></svg>
                    <h3></h3>
                    <button class="main_button">Réessayer</button>
                </div>
            </div>
        </section>
        <!-- Boutton de création de commande -->
        <footer>
            <button class="main_button" title="Créer une commande" id="create">Créer</button>
        </footer>
    </main>
    <!-- Module à contenu dynamique changeant selon les cas d'utilisation (affichage du catalogue de plat ou des détails du commande) -->
    <section id="modal" class="d-n jc-c ai-c">
        <article></article>
    </section>
    <!-- Zone d'affichage des notifications de suppression  -->
    <section id="popup"></section>
    <script type="module" src="./JS/script.js" defer></script>
</body>
</html>
