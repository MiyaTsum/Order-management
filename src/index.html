<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order management</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <header>
            <h2>Commandes</h2>
            <nav class="d-f">
                <!-- Option de filtrage des commandes -->
                <button title="Voir toutes les commandes" class="selected main_button" id="total"><span>Total </span><span>(0)</span></button>
                <button title="Voir les commadnes en en_cours" class="secondary_button" id="en_cours"><span>En cours </span><span>(0)</span></button>
                <button title="Voir les commandes servies" class="secondary_button" id="servie"><span>Servie </span><span>(0)</span></button>
                <button title="Voir les commandes déjà payées" class="secondary_button" id="payée"><span>Payée </span><span>(0)</span></button>
            </nav>
        </header>
        <div>
            <div id="search">
                <input title="Rechercher une commande grâce à son ID" type="number" placeholder="ID de commande" min="1">
                <button class="main_button" title="Vider la barre de recherche" disabled>Annuler</button>
            </div>
            <div id="liste">
                <div class="noResult d-f fd-cl ai-c">
                    <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" fill="none"><path d="M14 5H20" stroke="#7672F1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 8H17" stroke="#7672F1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 11.5C21 16.75 16.75 21 11.5 21C6.25 21 2 16.75 2 11.5C2 6.25 6.25 2 11.5 2" stroke="#7672F1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 22L20 20" stroke="#7672F1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <h3>Aucun commande trouvée</h3>
                    <button class="main_button">Créer</button>
                </div>
                <div class="onError d-f fd-cl ai-c">
                    <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 24 24" fill="none"><path d="M19.5099 5.85L13.5699 2.42C12.5999 1.86 11.3999 1.86 10.4199 2.42L4.48992 5.85C3.51992 6.41 2.91992 7.45 2.91992 8.58V15.42C2.91992 16.54 3.51992 17.58 4.48992 18.15L10.4299 21.58C11.3999 22.14 12.5999 22.14 13.5799 21.58L19.5199 18.15C20.4899 17.59 21.0899 16.55 21.0899 15.42V8.58C21.0799 7.45 20.4799 6.42 19.5099 5.85ZM11.2499 7.75C11.2499 7.34 11.5899 7 11.9999 7C12.4099 7 12.7499 7.34 12.7499 7.75V13C12.7499 13.41 12.4099 13.75 11.9999 13.75C11.5899 13.75 11.2499 13.41 11.2499 13V7.75ZM12.9199 16.63C12.8699 16.75 12.7999 16.86 12.7099 16.96C12.5199 17.15 12.2699 17.25 11.9999 17.25C11.8699 17.25 11.7399 17.22 11.6199 17.17C11.4899 17.12 11.3899 17.05 11.2899 16.96C11.1999 16.86 11.1299 16.75 11.0699 16.63C11.0199 16.51 10.9999 16.38 10.9999 16.25C10.9999 15.99 11.0999 15.73 11.2899 15.54C11.3899 15.45 11.4899 15.38 11.6199 15.33C11.9899 15.17 12.4299 15.26 12.7099 15.54C12.7999 15.64 12.8699 15.74 12.9199 15.87C12.9699 15.99 12.9999 16.12 12.9999 16.25C12.9999 16.38 12.9699 16.51 12.9199 16.63Z" fill="#7672F1"/></svg>
                    <h3></h3>
                    <button class="main_button">Réessayer</button>
                </div>
            </div>
        </div>
        <footer>
            <button class="main_button" title="Créer une commande" id="create">Créer</button>
        </footer>
    </main>
    <section id="modal" class="d-n jc-c ai-c">
        <article></article>
    </section>
    <section id="popup"></section>
    <script type="module" src="./JS/script.js" defer></script>
</body>
</html>
