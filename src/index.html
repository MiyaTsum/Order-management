<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order management</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <header>
            <h2>Commandes</h2>
            <nav>
                <!-- Option de filtrage des commandes -->
                <button class="selected" id="total"><span>Total </span><span></span></button>
                <button id="attente"><span>En attente </span><span></span></button>
                <button id="servie"><span>Servie </span><span></span></button>
                <button id="payée"><span>Payé </span><span></span></button>
            </nav>
        </header>
        <div>
            <div id="search">
                <input type="number" placeholder="ID de commande" min="1">
                <button disabled>Annuler</button>
            </div>
            <div id="liste"></div>
        </div>
        <footer>
            <button id="create">Créer</button>
        </footer>
    </main>
    <section id="modal">
        <article></article>
    </section>
    <section id="popup"></section>
    <script type="module" src="./JS/script.js"></script>
</body>
</html>
